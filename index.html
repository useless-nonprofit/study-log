<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f6fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="STUDY LOG">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>STUDY LOG</title>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">YOUR DAILY PROGRESS</p>
      <h1>STUDY LOG</h1>
    </div>
    <button id="exportBtn" class="icon-btn" aria-label="データを書き出す" title="データを書き出す">⇧</button>
  </header>

  <main>
    <section class="hero card">
      <div class="hero-row">
        <div>
          <p class="muted" id="todayLabel">今日の学習</p>
          <div class="big-time"><span id="todayMinutes">0</span><small>分</small></div>
        </div>
        <div class="goal-ring" id="goalRing"><div><strong id="goalPercent">0%</strong><small>達成</small></div></div>
      </div>
      <div class="progress"><div id="goalBar"></div></div>
      <div class="goal-line">
        <span>今日の目標</span>
        <label><input id="goalInput" type="number" min="10" max="1440" step="10" value="360"> 分</label>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><h2>フォーカスタイマー</h2><span class="pill" id="timerStatus">READY</span></div>
      <div class="card timer-card">
        <div class="timer-display" id="timerDisplay">25:00</div>
        <div class="timer-presets">
          <button class="preset active" data-min="25">25分</button>
          <button class="preset" data-min="50">50分</button>
          <button class="preset" data-min="90">90分</button>
        </div>
        <div class="timer-actions">
          <button id="startBtn" class="primary">スタート</button>
          <button id="resetBtn" class="secondary">リセット</button>
        </div>
        <p class="hint">タイマー終了時に学習記録へ自動で追加されます。</p>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><h2>今日のタスク</h2><span class="muted" id="taskCount">0件</span></div>
      <div class="card">
        <form id="taskForm" class="task-form">
          <input id="taskInput" maxlength="80" placeholder="例：英単語を30分" autocomplete="off" required>
          <button class="add-btn" type="submit">＋</button>
        </form>
        <ul id="taskList" class="task-list"></ul>
        <p id="emptyTasks" class="empty">タスクを追加して、今日やることを整理しましょう。</p>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><h2>学習を記録</h2></div>
      <form id="recordForm" class="card record-form">
        <label>科目・内容<input id="subjectInput" maxlength="60" placeholder="例：数学ⅡBC・数列" required></label>
        <div class="form-row">
          <label>学習時間（分）<input id="minutesInput" type="number" min="1" max="1440" placeholder="60" required></label>
          <label>日付<input id="dateInput" type="date" required></label>
        </div>
        <button class="primary full" type="submit">記録を追加</button>
      </form>
    </section>

    <section class="section">
      <div class="section-head"><h2>最近の記録</h2><button id="clearBtn" class="text-btn">履歴を削除</button></div>
      <div id="recordsList" class="records"></div>
      <p id="emptyRecords" class="empty">まだ記録がありません。</p>
    </section>

    <section class="section">
      <div class="section-head"><h2>自分へのメモ</h2></div>
      <div class="card">
        <textarea id="memo" rows="3" placeholder="今日の気づき、明日やることなど"></textarea>
        <p class="hint">このメモはこのiPhone内に自動保存されます。</p>
      </div>
    </section>
  </main>

  <footer>STUDY LOG <span>·</span> YOUR DATA STAYS ON THIS DEVICE</footer>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
